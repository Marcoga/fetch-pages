<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marco's Climbing Journal | Fetch Lab</title>
    <style>
        :root { 
            --bg: #0d1117; --card: #161b22; --accent: #fbbf24; --text: #f5f5f5; 
            --muted: #8b949e; --border: #30363d; 
        }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; }
        header { margin-bottom: 3rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
        h1 { color: var(--accent); margin: 0; }
        .session { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .date { font-weight: bold; color: var(--accent); display: block; margin-bottom: 10px; font-size: 1.1rem; }
        .links { display: flex; gap: 10px; margin-top: 15px; margin-bottom: 15px; }
        .btn { text-decoration: none; padding: 6px 12px; border-radius: 4px; font-size: 0.8rem; background: var(--border); color: var(--text); border: 1px solid transparent; }
        .btn:hover { border-color: var(--accent); }
        
        /* Notes Section */
        .notes-section { margin-top: 15px; }
        .notes-label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; display: block; }
        .notes-area { width: 100%; min-height: 80px; background: #0d1117; border: 1px solid var(--border); border-radius: 4px; color: #fff; padding: 10px; font-size: 0.9rem; resize: vertical; box-sizing: border-box; }
        .save-notes-btn { margin-top: 8px; font-size: 0.75rem; padding: 4px 10px; border-radius: 4px; border: 1px solid var(--border); background: var(--card); color: var(--muted); cursor: pointer; }
        .save-notes-btn:hover { color: var(--accent); border-color: var(--accent); }

        /* Highlights in Journal */
        .highlights { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 15px; border-top: 1px solid var(--border); padding-top: 15px; }
        .highlight-item { background: #000; aspect-ratio: 9/16; border-radius: 4px; overflow: hidden; position: relative; border: 1px solid var(--border); }
        .highlight-item img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
        .highlight-label { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); padding: 4px; font-size: 0.65rem; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="../index.html" style="color: var(--muted); text-decoration: none;">← Back to Dashboard</a>
            <h1>Marco's Training Journal</h1>
        </header>
        <div id="journal-content">Loading...</div>
    </div>
    <script>
        const USER_NAME = 'Marco';
        const manualHighlights = {
            '2026-02-19': [
                { label: '6b Send', img: '../assets/climb-gifs/climb_1.gif', type: 'marco' },
                { label: 'Vol Mastery', img: '../assets/climb-gifs/climb_4.gif', type: 'marco' }
            ]
        };

        function formatDate(isoString) {
            const [y, m, d] = isoString.split('-');
            return `${d}.${m}.${y}`;
        }

        async function saveNotes(date, btn) {
            const textarea = document.getElementById(`notes-${date}`);
            const notes = textarea.value;
            btn.innerText = 'Saving...';
            try {
                const res = await fetch('https://api.marcoga.com/api/sessions/notes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ date, notes, user: USER_NAME })
                });
                if (res.ok) {
                    btn.innerText = 'Saved!';
                    setTimeout(() => btn.innerText = 'Save Notes', 2000);
                } else {
                    btn.innerText = 'Error saving';
                }
            } catch (e) {
                console.error(e);
                btn.innerText = 'Failed to sync';
            }
        }

        async function load() {
            try {
                const res = await fetch(`https://api.marcoga.com/api/sessions?user=${USER_NAME}`);
                const data = await res.json();
                const container = document.getElementById('journal-content');
                container.innerHTML = '';
                
                const sessionsByDate = {};
                data.forEach(row => {
                    if (!sessionsByDate[row.date]) {
                        sessionsByDate[row.date] = { analyses: [], notes: row.notes || '', climber: row.climber };
                    }
                    if (row.url && !row.url.includes('giselle')) {
                        sessionsByDate[row.date].analyses.push({ model: row.model, url: '../' + row.url });
                    }
                });

                Object.keys(sessionsByDate).sort().reverse().forEach(date => {
                    const session = sessionsByDate[date];
                    if (!session.climber.includes(USER_NAME)) return;

                    const analyses = session.analyses;
                    const highlights = (manualHighlights[date] || []).filter(h => h.type === 'marco');
                    
                    container.innerHTML += `
                        <div class="session">
                            <span class="date">${formatDate(date)}</span>
                            <div class="links">
                                ${analyses.length > 0 ? 
                                    analyses.map(a => `<a href="${a.url}" class="btn">${a.model.toUpperCase()} Review</a>`).join('') :
                                    '<span>No digital analysis.</span>'
                                }
                            </div>
                            <div class="notes-section">
                                <span class="notes-label">Your Session Notes</span>
                                <textarea id="notes-${date}" class="notes-area" placeholder="Add beta, how you felt, or specific sends...">${session.notes}</textarea>
                                <button class="save-notes-btn" onclick="saveNotes('${date}', this)">Save Notes</button>
                            </div>
                            ${highlights.length > 0 ? `
                                <div class="highlights">
                                    ${highlights.map(h => `
                                        <div class="highlight-item">
                                            <img src="${h.img}">
                                            <div class="highlight-label">${h.label}</div>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}
                        </div>
                    `;
                });
            } catch (e) {
                console.error('Error loading journal:', e);
                document.getElementById('journal-content').innerText = 'Failed to load journal.';
            }
        }
        load();
    </script>
</body>
</html>
