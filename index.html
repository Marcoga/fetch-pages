<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Climbing Lab | Dashboard</title>
    <style>
        :root { 
            --bg: #0a0a0a; --card: #141414; --accent: #fbbf24; --text: #f5f5f5; 
            --muted: #a3a3a3; --border: #262626; --green-0: #161b22; --green-1: #0e4429;
            --green-2: #006d32; --green-3: #26a641; --green-4: #39d353;
        }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 2rem; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
        h1 { color: var(--accent); margin: 0; font-size: 1.8rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }
        .stat-card { background: var(--card); border: 1px solid var(--border); padding: 1.5rem; border-radius: 12px; }
        .stat-card h3 { margin: 0 0 0.5rem 0; font-size: 0.9rem; color: var(--muted); text-transform: uppercase; }
        .stat-card .value { font-size: 2rem; font-weight: bold; color: var(--accent); }
        
        .section-title { font-size: 1.2rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .heatmap-container { background: var(--card); border: 1px solid var(--border); padding: 1.5rem; border-radius: 12px; margin-bottom: 3rem; overflow-x: auto; }
        .heatmap { display: grid; grid-template-columns: repeat(53, 15px); grid-template-rows: repeat(7, 15px); gap: 3px; }
        .cell { width: 15px; height: 15px; border-radius: 2px; background: var(--green-0); cursor: pointer; position: relative; }
        .cell.active { background: var(--green-3); }
        .cell:hover { border: 1px solid #fff; }
        .tooltip { visibility: hidden; width: 120px; background-color: #333; color: #fff; text-align: center; border-radius: 6px; padding: 5px; position: absolute; z-index: 1; bottom: 125%; left: 50%; margin-left: -60px; font-size: 0.7rem; }
        .cell:hover .tooltip { visibility: visible; }

        .climbers { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
        .climber-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; }
        .climber-card h2 { margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        
        .session-item { margin-bottom: 1rem; padding: 1rem; background: #1c1c1c; border-radius: 8px; }
        .session-date { font-weight: bold; color: var(--accent); margin-bottom: 0.5rem; display: block; }
        .analysis-links { display: flex; gap: 10px; }
        .analysis-links a { font-size: 0.8rem; text-decoration: none; padding: 4px 8px; border-radius: 4px; background: var(--border); color: var(--text); border: 1px solid transparent; }
        .analysis-links a:hover { border-color: var(--accent); }
        .analysis-links a.opus { color: #38bdf8; }
        
        .recent-videos { margin-top: 3rem; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
        .video-thumb { background: #000; aspect-ratio: 9/16; border-radius: 8px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--muted); text-decoration: none; position: relative; overflow: hidden; }
        .video-thumb:hover { border-color: var(--accent); }
        .video-thumb span { z-index: 2; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .video-thumb img { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ Fetch Climbing Lab</h1>
            <div id="last-sync" style="color: var(--muted); font-size: 0.8rem;">Connected to Live Data</div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Sessions (Feb)</h3>
                <div class="value" id="stat-sessions">0</div>
            </div>
            <div class="stat-card">
                <h3>Videos Analyzed</h3>
                <div class="value">24</div>
            </div>
            <div class="stat-card">
                <h3>Top Grade</h3>
                <div class="value">6b+</div>
            </div>
            <div class="stat-card">
                <h3>Training Streak</h3>
                <div class="value" id="stat-streak">0 Days</div>
            </div>
        </div>

        <div class="section-title">📊 Activity Heatmap (Team)</div>
        <div class="heatmap-container">
            <div class="heatmap" id="heatmap-team"></div>
        </div>

        <div class="climbers">
            <div class="climber-card">
                <h2>Marco</h2>
                <div id="marco-sessions"></div>
            </div>
            <div class="climber-card">
                <h2>Giselle</h2>
                <div id="giselle-sessions"></div>
            </div>
        </div>

        <div class="recent-videos">
            <div class="section-title">🎬 Recent Highlights</div>
            <div class="video-grid">
                <a href="session-review-feb19.html" class="video-thumb">
                    <img src="assets/climb-gifs/climb_1.gif">
                    <span>Marco: 6b Send</span>
                </a>
                <a href="giselle-feedback-feb19.html" class="video-thumb">
                    <img src="assets/giselle-gifs/g5_victory.gif">
                    <span>Giselle: Yellow Send</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        async function init() {
            try {
                const res = await fetch('https://api.marcoga.com/api/sessions');
                const data = await res.json();
                
                // Group data by date
                const sessionsByDate = {};
                data.forEach(row => {
                    if (!sessionsByDate[row.date]) {
                        sessionsByDate[row.date] = {
                            date: row.date,
                            climber: row.climber,
                            analyses: []
                        };
                    }
                    if (row.url) {
                        sessionsByDate[row.date].analyses.push({ model: row.model, url: row.url });
                    }
                });

                const sessionList = Object.values(sessionsByDate).sort((a,b) => b.date.localeCompare(a.date));
                const activeDates = Object.keys(sessionsByDate);
                
                document.getElementById('stat-sessions').innerText = activeDates.filter(d => d.includes('2026-02')).length;
                document.getElementById('stat-streak').innerText = '6 Days'; // Static for now until better calc

                // Render Heatmap
                const heatmap = document.getElementById('heatmap-team');
                const startDate = new Date('2026-01-01');
                for (let i = 0; i < 53 * 7; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const currentDate = new Date(startDate);
                    currentDate.setDate(startDate.getDate() + i);
                    const dateStr = currentDate.toISOString().split('T')[0];
                    if (activeDates.includes(dateStr)) cell.classList.add('active');
                    
                    const tooltip = document.createElement('span');
                    tooltip.className = 'tooltip';
                    tooltip.innerText = dateStr;
                    cell.appendChild(tooltip);
                    heatmap.appendChild(cell);
                }

                // Render Sessions
                const marcoContainer = document.getElementById('marco-sessions');
                const giselleContainer = document.getElementById('giselle-sessions');

                sessionList.forEach(session => {
                    const html = `
                        <div class="session-item">
                            <span class="session-date">${session.date}</span>
                            <div class="analysis-links">
                                ${session.analyses.length > 0 ? 
                                    session.analyses.map(a => `<a href="${a.url}" class="${a.model}">${a.model.toUpperCase()} Review</a>`).join('') 
                                    : `<a href="#">Write Notes</a>`}
                            </div>
                        </div>
                    `;
                    
                    if (session.climber.includes('Marco')) marcoContainer.innerHTML += html;
                    if (session.climber.includes('Giselle')) giselleContainer.innerHTML += html;
                });

            } catch (e) {
                console.error('Failed to load live data', e);
            }
        }
        init();
    </script>
</body>
</html>
